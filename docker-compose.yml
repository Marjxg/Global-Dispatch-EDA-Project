services:
  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: newcron-solace
    shm_size: 1g
    ports:
      - "8080:8080"
      - "55555:55555"
      - "8008:8008"
    environment:
      username_admin_globalaccesslevel: admin
      username_admin_password: admin
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    container_name: newcron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: newcron
      POSTGRES_USER: newcron
      POSTGRES_PASSWORD: newcron_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U newcron -d newcron" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
